# Minimal Klipper config for the Avaota-A1 E906 co-processor bridge.
#
# The bridge exposes the E906 as an mcu over /tmp/klipper_host_e906.
# Pin names follow the R-domain S_PIO names used by e906-klipper:
#   PL2=STEP_X  PL3=DIR_X
#   PL4=STEP_Y  PL5=DIR_Y
#   PL6=HEATER  PL7=FAN
#   ES_X, ES_Y = virtual endstop input (mailbox +0x60)
#
# Keep speeds modest: with full_steps_per_rotation=200 and microsteps=2 the
# stepper runs at 400 steps/mm.  max_velocity=25 mm/s gives 10 ksteps/s,
# safely inside the E906's 50-20000 steps/s range.

[printer]
kinematics: cartesian
max_velocity: 25
max_accel: 50
max_z_velocity: 25
max_z_accel: 50

[mcu]
serial: /tmp/klipper_host_e906
restart_method: command

[stepper_x]
step_pin: PL2
dir_pin: !PL3
rotation_distance: 1.0
full_steps_per_rotation: 200
microsteps: 2
endstop_pin: ^ES_X
position_endstop: 0
position_max: 200
homing_speed: 15

[stepper_y]
step_pin: PL4
dir_pin: !PL5
rotation_distance: 1.0
full_steps_per_rotation: 200
microsteps: 2
endstop_pin: ^ES_Y
position_endstop: 0
position_max: 200
homing_speed: 15

[output_pin heater]
pin: PL6
pwm: True
cycle_time: 0.100
value: 0.0
shutdown_value: 0.0

[fan]
pin: PL7

# Needed for SET_KINEMATIC_POSITION (mark axes homed without a real home,
# there is no physical endstop).  Without this section the command is
# "Unknown command" and G1 refuses to move with "Must home axis first".
[force_move]
enable_force_move: True
